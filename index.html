<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate AI</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #2c5364);
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  backdrop-filter: blur(10px);
}

#chatbox {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.msg {
  padding: 10px 14px;
  border-radius: 15px;
  margin: 10px 0;
  max-width: 70%;
  animation: fadeIn 0.3s ease;
}

.user {
  background: #00c6ff;
  color: black;
  margin-left: auto;
}

.ai {
  background: rgba(255,255,255,0.2);
}

#inputArea {
  display: flex;
  padding: 10px;
  backdrop-filter: blur(10px);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  margin-left: 10px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #00c6ff;
  cursor: pointer;
}

.toggle {
  position: absolute;
  right: 15px;
  top: 15px;
}

.light {
  background: #f5f5f5;
  color: black;
}

.typing {
  font-style: italic;
  opacity: 0.7;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<header>🚀 StudyMate AI</header>
<button class="toggle" onclick="toggleMode()">🌙</button>

<div id="chatbox"></div>

<div id="inputArea">
  <input id="input" placeholder="Ask anything...">
  <button onclick="send()">Send</button>
</div>

<script>
function toggleMode() {
  document.body.classList.toggle("light");
}

function send() {
  let input = document.getElementById("input");
  let chatbox = document.getElementById("chatbox");

  let userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = input.value;
  chatbox.appendChild(userMsg);

  let typing = document.createElement("div");
  typing.className = "msg ai typing";
  typing.innerText = "Typing...";
  chatbox.appendChild(typing);

  let reply = getReply(input.value.toLowerCase());

  setTimeout(() => {
    typing.remove();
    let aiMsg = document.createElement("div");
    aiMsg.className = "msg ai";
    aiMsg.innerText = reply;
    chatbox.appendChild(aiMsg);
    chatbox.scrollTop = chatbox.scrollHeight;
  }, 1000);

  input.value = "";
}

function getReply(input) {
  if (input.includes("hello")) return "Hey 👋 I'm StudyMate AI!";
  if (input.includes("exam")) return "Revise NCERT + PYQs = 40/40 💯";
  if (input.includes("accountancy")) return "Focus on ratios + cash flow 🔥";
  if (input.includes("math")) return "Practice daily — formulas = key 🧠";
  if (input.includes("time table")) return "Study 45 min + 10 min break ⏱️";
  return "I'm still learning 😅 (real AI coming soon)";
}
</script>

</body>
</html>
