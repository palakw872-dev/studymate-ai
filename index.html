<!DOCTYPE html>
<html>
<head>
  <title>StudyMate AI</title>
  <style>
    body { font-family: Arial; background: #111; color: white; text-align: center; }
    .light { background: white; color: black; }
    button { padding: 10px; margin: 10px; }
    #chat { border: 1px solid gray; height: 200px; width: 80%; margin: auto; overflow: auto; }
  </style>
</head>
<body>

<h1>📚 StudyMate AI</h1>

<button onclick="toggle()">Light/Dark</button>

<div id="chat"></div>

<input id="input" placeholder="Ask something...">
<button onclick="send()">Send</button>

<script>
function toggle() {
  document.body.classList.toggle("light");
}

function send() {
  let input = document.getElementById("input").value;
  let chat = document.getElementById("chat");

  chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

  let reply = "I am your AI 🤖";

  if (input.includes("exam")) {
    reply = "Revise NCERT + practice = 40/40 💯";
  }

  chat.innerHTML += "<p><b>AI:</b> " + reply + "</p>";

  document.getElementById("input").value = "";
}
</script>

</body>
</html>
